name: Tests
on:
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  push:
    branches: [main, stable]
    paths-ignore: ['docs/**', 'README.md']
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: ${{ matrix.name || matrix.python }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.14'}
          - {python: '3.14t'}
          - {name: Windows, python: '3.14', os: windows-latest}
          - {name: Mac, python: '3.14', os: macos-latest}
          - {python: '3.13'}
          - {python: '3.12'}
          - {python: '3.11'}
          - {python: '3.10'}
          - {name: PyPy, python: 'pypy-3.11', tox: pypy3.11}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ddtest
        if: env.DD_API_KEY != '' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p bin
          curl -fsSL https://github.com/DataDog/ddtest/releases/download/v1.11.0/ddtest-${{ runner.os == 'Linux' && 'linux' || 'darwin' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }} -o bin/ddtest
          chmod +x bin/ddtest
      - name: Install ddtest
        if: env.DD_API_KEY != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://github.com/DataDog/ddtest/releases/download/v1.11.0/ddtest-windows-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}.exe -OutFile bin/ddtest.exe
      - name: Configure Datadog Test Optimization
        if: env.DD_API_KEY != ''
        uses: datadog/test-visibility-github-action@1abae93083b69778facd7ee11f89184306c999e6 # v3
        with:
          languages: python
          api_key: ${{ env.DD_API_KEY }}
          site: datadoghq.com
      - name: Run tests with Datadog Test Parallelization
        if: env.DD_API_KEY != '' && runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf .testoptimization
          bin/ddtest run --platform python --framework pytest --min-parallelism 1 --max-parallelism 4 --worker-env "TOX_WORK_DIR=.tox/ddtest-{{workerIndex}}" --command "uv run --locked --no-default-groups --group dev tox run --"
        env:
          TOX_ENV: ${{ matrix.tox || format('py{0}', matrix.python) }}
      - name: Run tests with Datadog Test Parallelization
        if: env.DD_API_KEY != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .testoptimization -ErrorAction SilentlyContinue
          ./bin/ddtest.exe run --platform python --framework pytest --min-parallelism 1 --max-parallelism 4 --worker-env "TOX_WORK_DIR=.tox/ddtest-{{workerIndex}}" --command "uv run --locked --no-default-groups --group dev tox run --"
        env:
          TOX_ENV: ${{ matrix.tox || format('py{0}', matrix.python) }}
      - name: Run tests without Datadog
        if: env.DD_API_KEY == ''
        run: uv run --locked --no-default-groups --group dev tox run
        env:
          TOX_ENV: ${{ matrix.tox || format('py{0}', matrix.python) }}
  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: pyproject.toml
      - name: cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.mypy_cache
          key: mypy|${{ hashFiles('pyproject.toml') }}
      - run: uv run --locked --no-default-groups --group dev tox run -e typing
